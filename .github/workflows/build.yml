name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Conceder permissão ao Gradle wrapper
        run: chmod +x gradlew

      - name: Build APK debug
        run: ./gradlew assembleDebug 2>&1 | tee build_output.txt; exit ${PIPESTATUS[0]}

      - name: Postar erros como Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRORS=$(grep -E "(error:|FAILED|Exception|Unresolved|e: file)" build_output.txt | head -60 || true)
          TAIL=$(tail -80 build_output.txt)
          BODY="## Erros de compilação\n\`\`\`\n${ERRORS}\n\`\`\`\n\n## Últimas 80 linhas\n\`\`\`\n${TAIL}\n\`\`\`"
          gh issue create \
            --title "Build log: $(date '+%Y-%m-%d %H:%M')" \
            --body "$BODY" \
            --label "build-log" \
            --repo ${{ github.repository }} || true

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutomaPoko-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          retention-days: 7
