name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Conceder permissão ao Gradle wrapper
        run: chmod +x gradlew

      - name: Build APK debug
        run: ./gradlew assembleDebug 2>&1 | tee build_output.txt; exit ${PIPESTATUS[0]}

      - name: Resumo de erros no GitHub Summary
        if: failure()
        run: |
          echo "## ❌ Erros de Compilação" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(error:|FAILED|Exception|Unresolved|Could not resolve|e: file|> Task)" \
            build_output.txt | head -80 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Últimas 60 linhas:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 build_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutomaPoko-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          retention-days: 7
