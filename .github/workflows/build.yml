name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Conceder permissão ao Gradle wrapper
        run: chmod +x gradlew

      - name: Build APK debug
        id: build
        run: ./gradlew assembleDebug 2>&1 | tee build_output.txt; exit ${PIPESTATUS[0]}

      - name: Exibir erros de build (se falhou)
        if: failure()
        run: |
          echo "===== ERROS DE COMPILAÇÃO ====="
          grep -E "(error:|FAILED|Exception|Unresolved|Could not|> Task|e:)" build_output.txt | head -100 || true
          echo ""
          echo "===== ÚLTIMAS 150 LINHAS DO LOG ====="
          tail -150 build_output.txt

      - name: Publicar APK como artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutomaPoko-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar log de build (para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          retention-days: 7
